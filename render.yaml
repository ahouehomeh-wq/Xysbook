services:
  - type: web
    name: xys-book-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"
      - key: ADMIN_EMAILS
        value: "change-moi@email.com"
      - key: DATABASE_URL
        fromDatabase:
          name: xys-book-db
          property: connectionString

databases:
  - name: xys-book-db
    plan: free
    databaseName: xys_book
    user: xys_book_user
